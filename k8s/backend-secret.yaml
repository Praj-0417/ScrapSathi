# ─── ScrapSaathi Backend — Kubernetes Secrets ─────────────────────────────────
# IMPORTANT: Never commit real values here.
# Generate base64 values with: echo -n "your-value" | base64
# Apply with: kubectl apply -f backend-secret.yaml
# Or use Sealed Secrets / External Secrets Operator for production.

apiVersion: v1
kind: Secret
metadata:
  name: scrapsaathi-backend-secret
  namespace: scrapsaathi
  labels:
    app: scrapsaathi
    component: backend
type: Opaque
data:
  # base64-encoded values — replace with real ones
  # echo -n "your-value" | base64
  MongoDB: <base64-encoded-mongodb-uri>
  JWT_SECRET: <base64-encoded-jwt-secret>
  PRIMARY_EMAIL: <base64-encoded-email>
  PRIMARY_EMAIL_PASSWORD: <base64-encoded-app-password>
  FALLBACK_EMAIL: <base64-encoded-fallback-email>
  FALLBACK_EMAIL_PASSWORD: <base64-encoded-fallback-password>
  CLOUDINARY_CLOUD_NAME: <base64-encoded-cloud-name>
  CLOUDINARY_API_KEY: <base64-encoded-api-key>
  CLOUDINARY_API_SECRET: <base64-encoded-api-secret>
